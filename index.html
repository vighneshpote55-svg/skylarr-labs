<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/skylarr-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skylarr Labs® — PCD Pharma Franchise Opportunity</title>
    <meta name="description" content="Partner with Skylarr Labs for PCD Pharma Franchise. Exclusive monopoly territory rights, comprehensive marketing collateral, GMP-certified formulations, and high-margin product lines." />
    <!-- Default to White Mode -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('skylarr-theme-mode');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FCFDFD] dark:bg-[#0A110D] text-[#17231F] dark:text-[#F1F5F3] font-sans antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
